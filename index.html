<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 커스텀 단어 빙고</title>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import { GoogleGenAI } from 'https://esm.run/@google/genai';
        window.createClient = createClient;
        window.GoogleGenAI = GoogleGenAI;
        window.dispatchEvent(new Event('supabase-loaded'));
    </script>
    <style>
        :root {
            --bg-color: #1e1e24;
            --card-bg: #2b2b36;
            --text-primary: #f1f2f6;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --bingo-checked: #2ed573;
            --danger: #ff4757;
            --border-color: #40404f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 25px; color: white; text-align: center; }

        .container {
            background-color: var(--card-bg);
            width: 100%; max-width: 450px;
            padding: 25px; border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px; box-sizing: border-box;
        }
        input, textarea {
            width: 100%; background: #1a1a21; border: 1px solid var(--border-color);
            color: white; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 12px;
            box-sizing: border-box; resize: vertical;
        }
        button {
            background: var(--accent); color: white; border: none;
            padding: 12px 20px; font-size: 15px; font-weight: bold;
            border-radius: 6px; cursor: pointer; width: 100%; transition: 0.2s; margin-bottom: 10px;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #57606f; cursor: not-allowed; opacity: 0.6; }

        .screen { display: none; width: 100%; max-width: 450px; }
        
        .bingo-board {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; aspect-ratio: 1; margin-bottom: 15px;
        }
        .bingo-cell {
            background: #1a1a21; border: 1px solid var(--border-color); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; padding: 4px;
            user-select: none; transition: 0.1s; color: #dcdde1; word-break: break-all;
        }
        .bingo-cell:not(.checked):hover { background: #3d3d4e; }
        .bingo-cell.checked { background: var(--bingo-checked); color: white; text-decoration: line-through; border-color: #26af5f; }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 15px;
        }
        .btn-secondary { background: #57606f; }
        .btn-secondary:hover { background: #747d8c; }
        .btn-bingo { background: var(--danger); font-size: 16px; display: none; animation: pulse 1s infinite; width: 100%; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .player-list {
            background: #1a1a21; border: 1px solid var(--border-color); border-radius: 6px;
            padding: 12px; min-height: 80px; max-height: 150px; overflow-y: auto; margin-bottom: 15px;
        }
        .player-item { padding: 6px 0; border-bottom: 1px solid #2b2b36; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }

        #game-over-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 999;
            justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

    <h1>실시간 커스텀 단어 빙고</h1>

    <!-- 메인 화면 -->
    <div class="container" id="mode-select-screen">
        <h3>게임 모드</h3>
        <button onclick="showHostSetup()">방 만들기</button>
        <p style="font-size: 12px; color: #a4b0be; text-align: center; margin-top: 5px;">참여자는 공유받은 링크를 통해 접속할 수 있습니다.</p>
    </div>

    <!-- 방장 설정 화면 -->
    <div class="container screen" id="host-setup-screen">
        <h3>방 만들기 (방장)</h3>
        <label style="font-size: 13px; color: #a4b0be;">방장 닉네임</label>
        <input type="text" id="host-nickname" placeholder="닉네임 입력">

        <label style="font-size: 13px; color: #a4b0be;">목표 빙고 줄 수</label>
        <input type="number" id="target-lines-input" value="3" min="1" max="12">
        
        <button onclick="createRoom()">랜덤 링크 생성 및 방 들어가기</button>
        <button class="btn-secondary" onclick="backToMain()">뒤로 가기</button>
    </div>

    <!-- 참여자 닉네임 입력 화면 -->
    <div class="container screen" id="guest-setup-screen">
        <h3>게임 참여하기</h3>
        <p style="font-size: 13px; color: #a4b0be; margin-bottom: 15px;">초대받은 빙고 방에 입장합니다. 사용할 닉네임을 입력해주세요!</p>
        
        <label style="font-size: 13px; color: #a4b0be;">내 닉네임</label>
        <input type="text" id="guest-nickname" placeholder="닉네임 입력">
        
        <button onclick="joinRoomWithNickname()">대기실 들어가기</button>
    </div>

    <!-- 대기실 화면 -->
    <div class="container screen" id="waiting-room-screen">
        <h3>대기실</h3>
        
        <!-- 초대 링크 영역 -->
        <div id="share-link-area" style="margin-bottom: 15px; display: none;">
            <p style="font-size: 13px; color: #a4b0be; margin-bottom: 5px;">초대 링크</p>
            <input type="text" id="share-link-input" readonly style="background: #111; color: #2ed573; text-align: center; font-weight: bold; margin-bottom: 8px;">
            <button onclick="copyLink()" style="margin-bottom: 10px;">링크 복사하기</button>
        </div>

        <!-- 주제 설정/표시 영역 -->
        <div id="topic-container" style="margin-bottom: 15px;">
            <p style="font-size: 13px; color: #a4b0be; margin-bottom: 5px;">게임 주제</p>
            <!-- 방장 전용 주제 수정 폼 -->
            <div id="host-topic-area" style="display: none; gap: 6px; margin-bottom: 5px;">
                <input type="text" id="room-topic-input" placeholder="예: 동물" style="margin-bottom: 0;">
                <button onclick="updateRoomTopic()" style="width: 90px; margin-bottom: 0; padding: 0;">주제 저장</button>
            </div>
            <!-- 참여자 전용 주제 표시 뱃지 -->
            <div id="guest-topic-badge" style="background: #1a1a21; border: 1px solid var(--accent); padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; color: var(--accent); display: none;">
                주제: 불러오는 중...
            </div>
        </div>

        <label style="font-size: 13px; color: #a4b0be;">참여한 플레이어 및 단어 작성 현황</label>
        <div class="player-list" id="player-list-box"></div>

        <div style="margin-top: 15px;">
            <label style="font-size: 13px; color: #a4b0be;">내 빙고 단어 입력 (25개 이상, 엔터/콤마 구분)</label>
            <textarea id="my-words" rows="4" placeholder="원하는 단어들을 직접 입력해주세요 (25개 이상)" oninput="updateMyWordStatusOnly()"></textarea>
            <p id="word-count-status" style="font-size: 12px; color: #ff4757; margin-top: -8px; margin-bottom: 10px;">작성된 단어: 0 / 25개 (미완료)</p>
            <button onclick="saveMyWordsToSupabase()" style="background: var(--bingo-checked); font-size: 14px; padding: 10px; margin-bottom: 5px;">✅ 작성완료</button>
        </div>

        <button id="host-start-btn" onclick="startHostGame()" disabled style="background: var(--bingo-checked); margin-top: 10px; display: none;">모든 인원이 단어를 작성해야 시작 가능</button>
        <p id="guest-waiting-msg" style="text-align: center; color: #a4b0be; font-size: 13px; margin-top: 10px; display: none;">모든 인원이 단어를 작성하고 방장이 시작하기를 기다리는 중...</p>
    </div>

    <!-- 게임 화면 -->
    <div class="screen" id="game-screen">
        <div class="container" style="max-width: 100%;">
            <div id="game-topic-display" style="font-size: 13px; color: #a4b0be; margin-bottom: 8px; text-align: center;">주제: -</div>
            
            <!-- 단어 제시 카드 영역 -->
            <div style="background: #1a1a21; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px;">
                <p style="font-size: 12px; color: #a4b0be; margin: 0 0 5px 0;">현재 제시어</p>
                <h2 id="current-clue-display" style="color: var(--bingo-checked); margin: 0; font-size: 24px;">준비 중...</h2>
                <button id="next-clue-btn" onclick="nextClue()" style="display: none; margin-top: 12px; background: var(--accent); margin-bottom: 0;">➡️ 다음 제시어 뽑기</button>
            </div>

            <div class="status-bar">
                <span id="player-title">빙고판</span>
                <span id="bingo-status" style="color: var(--bingo-checked);">완성된 줄: 0줄</span>
            </div>
            <div class="bingo-board" id="board"></div>
            <button class="btn-bingo" id="bingo-claim-btn" onclick="claimBingo()">🚨 BINGO 완성! 게임 끝내기 🚨</button>
        </div>
    </div>

    <!-- 게임 오버 모달 -->
    <div id="game-over-overlay">
        <h2 id="winner-text" style="color: var(--bingo-checked); margin-bottom: 10px;"></h2>
        <p id="winner-sub-text" style="color: #a4b0be; margin-bottom: 20px;">누군가 빙고를 완성했습니다!</p>
        <button id="game-over-btn" onclick="returnToWaitingRoom()" style="max-width: 250px; background: var(--bingo-checked); display: none;">다시하기</button>
    </div>

    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                return false;
            }
        });

        const SUPABASE_URL = 'https://mlazabosisxkhnsjvwqo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_imu1GbW4Wl_mP91NtA2NTg_w-_AVgya';

        let supabaseClient = null;
        let genAIClient = null;
        let myNickname = '';
        let isHost = false;
        let targetLines = 3;
        let gameTopic = '';
        let roomId = '';
        let currentBoardWords = [];
        let syncInterval = null;
        let heartbeatInterval = null;

        function initClients() {
            if (window.createClient) {
                try {
                    supabaseClient = window.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: { persistSession: false, storage: null }
                    });
                } catch (e) {
                    console.error("Supabase 생성 오류:", e);
                }
            }
            if (window.GoogleGenAI) {
                try {
                    genAIClient = new window.GoogleGenAI({ apiKey: "AIzaSyD-aL2WfS6G_8jX4v9K2p3L1m5N7q0" });
                } catch (e) {
                    console.error("Gemini 생성 오류:", e);
                }
            }
            return supabaseClient !== null;
        }

        window.addEventListener('supabase-loaded', () => {
            if (initClients()) {
                checkInitialRoute();
            }
        });

        window.onload = function() {
            if (initClients()) {
                checkInitialRoute();
            } else {
                window.addEventListener('supabase-loaded', () => {
                    checkInitialRoute();
                }, { once: true });
            }
        };

        async function checkInitialRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            roomId = urlParams.get('room');

            if (roomId) {
                document.getElementById('mode-select-screen').style.display = 'none';

                const savedNick = localStorage.getItem(`bingo_nick_${roomId}`);
                const savedRole = localStorage.getItem(`bingo_isHost_${roomId}`) === 'true';

                if (savedNick) {
                    myNickname = savedNick;
                    isHost = savedRole;

                    const savedWords = localStorage.getItem(`bingo_words_${roomId}`);
                    if (savedWords) {
                        document.getElementById('my-words').value = savedWords;
                        window.updateMyWordStatusOnly(false);
                    }

                    if (isHost) {
                        const shareUrl = window.location.href;
                        document.getElementById('share-link-input').value = shareUrl;
                        document.getElementById('share-link-area').style.display = 'block';
                        document.getElementById('host-topic-area').style.display = 'flex';
                        document.getElementById('host-start-btn').style.display = 'block';
                    } else {
                        document.getElementById('guest-topic-badge').style.display = 'block';
                        document.getElementById('guest-waiting-msg').style.display = 'block';
                    }
                    document.getElementById('waiting-room-screen').style.display = 'block';

                    await restoreMySession();
                    startSyncLoop();
                    startHeartbeat();
                } else {
                    document.getElementById('guest-setup-screen').style.display = 'block';
                }
            }
        }

        async function restoreMySession() {
            if (!supabaseClient) return;
            const { data } = await supabaseClient.from('rooms').select('*').eq('id', roomId).maybeSingle();
            if (data) {
                targetLines = data.target_lines || 3;
                gameTopic = data.topic || '자유 주제';
                
                if (isHost) {
                    document.getElementById('room-topic-input').value = gameTopic;
                } else {
                    document.getElementById('guest-topic-badge').innerText = `🎯 주제: ${gameTopic}`;
                }
                updateGameTopicDisplay(gameTopic);

                let playersStatus = data.players_status || {};
                let heartbeats = data.heartbeats || {};

                playersStatus[myNickname] = checkIsReady();
                heartbeats[myNickname] = Date.now();

                await supabaseClient.from('rooms').update({ 
                    players_status: playersStatus,
                    heartbeats: heartbeats 
                }).eq('id', roomId);

                updateWaitingRoomUI(playersStatus);

                if (data.status === 'playing') {
                    startTheGame(data.current_clue);
                }
            }
        }

        window.showHostSetup = function() {
            document.getElementById('mode-select-screen').style.display = 'none';
            document.getElementById('host-setup-screen').style.display = 'block';
        };

        window.backToMain = function() {
            clearSessionData();
            document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
            document.getElementById('mode-select-screen').style.display = 'block';
            if (syncInterval) clearInterval(syncInterval);
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            window.history.replaceState({}, document.title, window.location.pathname);
        };

        async function clearSessionData() {
            if (!roomId || !myNickname || !supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('rooms').select('players_status, heartbeats, player_words').eq('id', roomId).maybeSingle();
                if (data) {
                    let ps = data.players_status || {};
                    let hb = data.heartbeats || {};
                    let pw = data.player_words || {};
                    delete ps[myNickname];
                    delete hb[myNickname];
                    delete pw[myNickname];
                    await supabaseClient.from('rooms').update({ players_status: ps, heartbeats: hb, player_words: pw }).eq('id', roomId);
                }
            } catch(e) {}
            localStorage.removeItem(`bingo_nick_${roomId}`);
            localStorage.removeItem(`bingo_isHost_${roomId}`);
            localStorage.removeItem(`bingo_words_${roomId}`);
        }

        window.createRoom = async function() {
            if (!supabaseClient) {
                alert("데이터베이스 연결 초기화 중입니다. 잠시 후 다시 시도해주세요.");
                return;
            }

            const nick = document.getElementById('host-nickname').value.trim();
            if (!nick) { alert('방장 닉네임을 입력해주세요!'); return; }

            targetLines = parseInt(document.getElementById('target-lines-input').value) || 3;
            gameTopic = '자유 주제';

            myNickname = nick;
            isHost = true;
            roomId = Math.random().toString(36).substring(2, 8);

            localStorage.setItem(`bingo_nick_${roomId}`, myNickname);
            localStorage.setItem(`bingo_isHost_${roomId}`, 'true');

            const initialPlayersObj = {};
            initialPlayersObj[myNickname] = false; 
            const initialHeartbeats = {};
            initialHeartbeats[myNickname] = Date.now();

            const { error } = await supabaseClient.from('rooms').insert([
                { 
                    id: roomId, 
                    status: 'waiting', 
                    topic: gameTopic,
                    target_lines: targetLines, 
                    players_status: initialPlayersObj,
                    heartbeats: initialHeartbeats,
                    player_words: {},
                    current_clue: '시작 대기 중',
                    used_clues: []
                }
            ]);

            if (error) {
                alert('방 생성 오류: ' + error.message);
                return;
            }

            const shareUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            window.history.replaceState({}, document.title, `?room=${roomId}`);

            document.getElementById('share-link-input').value = shareUrl;
            document.getElementById('share-link-area').style.display = 'block';
            document.getElementById('host-topic-area').style.display = 'flex';
            document.getElementById('room-topic-input').value = gameTopic;
            document.getElementById('host-start-btn').style.display = 'block';
            
            document.getElementById('host-setup-screen').style.display = 'none';
            document.getElementById('waiting-room-screen').style.display = 'block';

            updateGameTopicDisplay(gameTopic);
            updateWaitingRoomUI(initialPlayersObj);
            startSyncLoop();
            startHeartbeat();
        };

        window.updateRoomTopic = async function() {
            if (!isHost || !supabaseClient) return;
            const newTopic = document.getElementById('room-topic-input').value.trim() || '자유 주제';
            const { error } = await supabaseClient.from('rooms').update({ topic: newTopic }).eq('id', roomId);
            if (error) {
                alert('주제 업데이트 실패: ' + error.message);
            } else {
                gameTopic = newTopic;
                updateGameTopicDisplay(gameTopic);
                alert('게임 주제가 변경되었습니다!');
            }
        };

        window.joinRoomWithNickname = async function() {
            if (!supabaseClient) return;
            const nickInput = document.getElementById('guest-nickname').value.trim();
            if (!nickInput) {
                alert('사용할 닉네임을 입력해주세요!');
                return;
            }

            myNickname = nickInput;
            isHost = false;

            localStorage.setItem(`bingo_nick_${roomId}`, myNickname);
            localStorage.setItem(`bingo_isHost_${roomId}`, 'false');

            const { data, error } = await supabaseClient.from('rooms').select('*').eq('id', roomId).maybeSingle();
            if (error || !data) {
                alert('존재하지 않거나 만료된 방입니다.');
                window.location.href = window.location.pathname;
                return;
            }

            targetLines = data.target_lines || 3;
            gameTopic = data.topic || '자유 주제';
            document.getElementById('guest-topic-badge').innerText = `🎯 주제: ${gameTopic}`;
            updateGameTopicDisplay(gameTopic);

            let playersStatus = data.players_status || {};
            let heartbeats = data.heartbeats || {};
            
            playersStatus[myNickname] = checkIsReady();
            heartbeats[myNickname] = Date.now();

            await supabaseClient.from('rooms').update({ 
                players_status: playersStatus,
                heartbeats: heartbeats 
            }).eq('id', roomId);

            document.getElementById('guest-setup-screen').style.display = 'none';
            document.getElementById('guest-topic-badge').style.display = 'block';
            document.getElementById('guest-waiting-msg').style.display = 'block';
            document.getElementById('waiting-room-screen').style.display = 'block';

            updateWaitingRoomUI(playersStatus);
            startSyncLoop();
            startHeartbeat();

            if (data.status === 'playing') {
                startTheGame(data.current_clue);
            }
        };

        function updateGameTopicDisplay(topic) {
            document.getElementById('game-topic-display').innerText = `🎯 주제: ${topic}`;
        }

        function checkIsReady() {
            const rawText = document.getElementById('my-words').value;
            let words = rawText.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
            return words.length >= 25;
        }

        window.updateMyWordStatusOnly = function(saveToLocal = true) {
            const rawText = document.getElementById('my-words').value;
            
            if (saveToLocal && roomId) {
                localStorage.setItem(`bingo_words_${roomId}`, rawText);
            }

            let words = rawText.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
            const count = words.length;
            const statusIndicator = document.getElementById('word-count-status');

            let isReady = count >= 25;
            if (isReady) {
                statusIndicator.innerText = `작성된 단어: ${count}개 (작성 완료 ✅)`;
                statusIndicator.style.color = 'var(--bingo-checked)';
            } else {
                statusIndicator.innerText = `작성된 단어: ${count} / 25개 (미완료 ❌)`;
                statusIndicator.style.color = 'var(--danger)';
            }
        };

        window.saveMyWordsToSupabase = async function() {
            if (!roomId || !myNickname || !supabaseClient) return;
            if (!checkIsReady()) {
                alert('단어를 25개 이상 작성해야 작성완료를 할 수 있습니다!');
                return;
            }
            const rawText = document.getElementById('my-words').value;
            let words = rawText.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);

            const { data } = await supabaseClient.from('rooms').select('players_status, player_words').eq('id', roomId).maybeSingle();
            if (data) {
                let ps = data.players_status || {};
                let pw = data.player_words || {};
                ps[myNickname] = true;
                pw[myNickname] = words;
                const { error } = await supabaseClient.from('rooms').update({ players_status: ps, player_words: pw }).eq('id', roomId);
                if (error) {
                    alert('저장 실패: ' + error.message);
                } else {
                    alert('작성 완료 처리가 반영되었습니다!');
                }
            }
        };

        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(async () => {
                if (!roomId || !myNickname || !supabaseClient) return;
                try {
                    const { data } = await supabaseClient.from('rooms').select('heartbeats').eq('id', roomId).maybeSingle();
                    if (data) {
                        let hb = data.heartbeats || {};
                        hb[myNickname] = Date.now();
                        await supabaseClient.from('rooms').update({ heartbeats: hb }).eq('id', roomId);
                    }
                } catch(e) {}
            }, 2000);
        }

        function startSyncLoop() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(async () => {
                if (!roomId || !supabaseClient) return;
                const { data, error } = await supabaseClient.from('rooms').select('*').eq('id', roomId).maybeSingle();
                if (error || !data) {
                    alert('방이 종료되었거나 삭제되었습니다.');
                    localStorage.clear();
                    window.location.href = window.location.pathname;
                    return;
                }

                if (data.topic && data.topic !== gameTopic) {
                    gameTopic = data.topic;
                    if (!isHost) {
                        document.getElementById('guest-topic-badge').innerText = `🎯 주제: ${gameTopic}`;
                    }
                    updateGameTopicDisplay(gameTopic);
                }

                let playersStatus = data.players_status || {};
                let heartbeats = data.heartbeats || {};
                let now = Date.now();
                let updated = false;

                Object.keys(heartbeats).forEach(name => {
                    if (now - heartbeats[name] > 5000) {
                        delete heartbeats[name];
                        delete playersStatus[name];
                        updated = true;
                    }
                });

                if (updated) {
                    let pw = data.player_words || {};
                    Object.keys(heartbeats).forEach(name => { delete pw[name]; });
                    await supabaseClient.from('rooms').update({ 
                        players_status: playersStatus, 
                        heartbeats: heartbeats,
                        player_words: pw
                    }).eq('id', roomId);
                }

                if (playersStatus) {
                    updateWaitingRoomUI(playersStatus);
                }

                if (data.current_clue) {
                    document.getElementById('current-clue-display').innerText = data.current_clue;
                }

                if (data.status === 'playing' && document.getElementById('game-screen').style.display !== 'block') {
                    startTheGame(data.current_clue);
                }

                if (data.status === 'gameover' && data.winner && document.getElementById('game-over-overlay').style.display !== 'flex') {
                    showGameOver(data.winner);
                }

                if (data.status === 'waiting' && document.getElementById('waiting-room-screen').style.display !== 'block' && document.getElementById('game-screen').style.display === 'block') {
                    resetToWaitingRoomUI();
                }
            }, 1500);
        }

        window.copyLink = function() {
            const input = document.getElementById('share-link-input');
            input.select();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(input.value).then(() => {
                    alert('초대 링크가 복사되었습니다!');
                }).catch(() => {
                    document.execCommand('copy');
                    alert('초대 링크가 복사되었습니다!');
                });
            } else {
                document.execCommand('copy');
                alert('초대 링크가 복사되었습니다!');
            }
        };

        function updateWaitingRoomUI(playersStatus) {
            const listDiv = document.getElementById('player-list-box');
            listDiv.innerHTML = '';
            
            let allReady = true;
            let playerNames = Object.keys(playersStatus);

            if (playerNames.length === 0) allReady = false;

            playerNames.forEach(name => {
                const isReady = playersStatus[name];
                if (!isReady) allReady = false;

                const item = document.createElement('div');
                item.className = 'player-item';
                item.innerHTML = `👤 ${name} <span style="font-size: 12px; color: ${isReady ? 'var(--bingo-checked)' : 'var(--danger)'};">${isReady ? '단어 작성 완료 ✅' : '작성 중... ❌'}</span>`;
                listDiv.appendChild(item);
            });

            if (isHost) {
                const startBtn = document.getElementById('host-start-btn');
                if (allReady && playerNames.length > 0) {
                    startBtn.disabled = false;
                    startBtn.innerText = '게임 시작하기!';
                } else {
                    startBtn.disabled = true;
                    startBtn.innerText = '모든 인원이 단어를 작성해야 시작 가능';
                }
            }
        }

        async function getValidClue(roomData) {
            let playerWordsObj = roomData.player_words || {};
            let allWords = [];
            
            // 모든 참가자들이 작성한 단어들을 모음
            Object.values(playerWordsObj).forEach(arr => {
                if (Array.isArray(arr)) allWords.push(...arr);
            });
            
            // 중복 제거
            allWords = [...new Set(allWords)];

            let usedClues = roomData.used_clues || [];
            // 이미 사용된 제시어를 제외하고 남은 단어 목록 추출
            let available = allWords.filter(w => !usedClues.includes(w));

            // 만약 모든 단어가 소진되었다면 used_clues를 초기화하여 재사용 가능하게 함
            if (available.length === 0 && allWords.length > 0) {
                await supabaseClient.from('rooms').update({ used_clues: [] }).eq('id', roomId);
                available = allWords;
            }

            if (available.length === 0) return null;

            // 남은 단어들 중 무작위로 하나 추출
            return available[Math.floor(Math.random() * available.length)];
        }

        window.startHostGame = async function() {
            if (!isHost || !supabaseClient) return;

            const { data } = await supabaseClient.from('rooms').select('*').eq('id', roomId).maybeSingle();
            if (!data) return;

            const firstClue = await getValidClue(data);
            if (!firstClue) {
                alert('참여자들이 작성한 단어가 없습니다. 모든 참여자가 단어를 작성하고 작성완료를 눌렀는지 확인해주세요.');
                return;
            }

            await supabaseClient.from('rooms').update({ 
                status: 'playing', 
                winner: null,
                current_clue: firstClue,
                used_clues: [firstClue]
            }).eq('id', roomId);
        };

        window.nextClue = async function() {
            if (!isHost || !supabaseClient) return;

            const { data } = await supabaseClient.from('rooms').select('*').eq('id', roomId).maybeSingle();
            if (!data) return;

            const nextC = await getValidClue(data);
            if (!nextC) {
                alert('사용 가능한 모든 제시어가 소진되었습니다!');
                return;
            }

            let usedClues = data.used_clues || [];
            usedClues.push(nextC);

            await supabaseClient.from('rooms').update({ 
                current_clue: nextC,
                used_clues: usedClues
            }).eq('id', roomId);
        };

        function startTheGame(clue) {
            const rawText = document.getElementById('my-words').value;
            let words = rawText.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);

            if (words.length < 25) {
                words = Array.from({length: 25}, (_, i) => `단어${i+1}`);
            }

            words.sort(() => Math.random() - 0.5);
            currentBoardWords = words.slice(0, 25);

            document.getElementById('game-over-overlay').style.display = 'none';
            document.getElementById('waiting-room-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('player-title').innerText = `${myNickname}님의 빙고판`;
            
            if (clue) {
                document.getElementById('current-clue-display').innerText = clue;
            }

            if (isHost) {
                document.getElementById('next-clue-btn').style.display = 'block';
            } else {
                document.getElementById('next-clue-btn').style.display = 'none';
            }

            renderBoard();
        }

        function renderBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';

            let playerBoard = [...currentBoardWords].sort(() => Math.random() - 0.5);

            playerBoard.forEach((word) => {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell';
                cell.innerText = word;

                cell.addEventListener('click', () => {
                    cell.classList.toggle('checked');
                    checkBingoLogic();
                });
                boardDiv.appendChild(cell);
            });
            document.getElementById('bingo-status').innerText = '완성된 줄: 0줄';
            document.getElementById('bingo-claim-btn').style.display = 'none';
        }

        function checkBingoLogic() {
            const cells = document.querySelectorAll('.bingo-cell');
            let matrix = [];
            for (let i = 0; i < 5; i++) {
                let row = [];
                for (let j = 0; j < 5; j++) {
                    row.push(cells[i * 5 + j].classList.contains('checked'));
                }
                matrix.push(row);
            }

            let bingoCount = 0;
            for (let i = 0; i < 5; i++) if (matrix[i].every(v => v)) bingoCount++;
            for (let j = 0; j < 5; j++) if ([0,1,2,3,4].every(i => matrix[i][j])) bingoCount++;
            if ([0,1,2,3,4].every(i => matrix[i][i])) bingoCount++;
            if ([0,1,2,3,4].every(i => matrix[i][4-i])) bingoCount++;

            document.getElementById('bingo-status').innerText = `완성된 줄: ${bingoCount}줄`;

            const claimBtn = document.getElementById('bingo-claim-btn');
            if (bingoCount >= targetLines) {
                claimBtn.style.display = 'block';
            } else {
                claimBtn.style.display = 'none';
            }
        }

        window.claimBingo = async function() {
            if (!supabaseClient) return;
            await supabaseClient.from('rooms').update({ 
                status: 'gameover', 
                winner: myNickname 
            }).eq('id', roomId);
            
            showGameOver(myNickname);
        };

        async function showGameOver(winnerName) {
            document.getElementById('game-over-overlay').style.display = 'flex';
            
            const subText = document.getElementById('winner-sub-text');
            const gameOverBtn = document.getElementById('game-over-btn');

            if (winnerName === myNickname) {
                document.getElementById('winner-text').innerText = `🎉 승리 추카!! 🎉`;
                subText.style.display = 'none';
            } else {
                document.getElementById('winner-text').innerText = `🎉 승자: ${winnerName}님! 🎉`;
                subText.style.display = 'block';
                subText.innerText = '누군가 빙고를 완성했습니다!';
            }

            if (isHost) {
                gameOverBtn.style.display = 'block';
            } else {
                gameOverBtn.style.display = 'none';
            }
        }

        window.returnToWaitingRoom = async function() {
            document.getElementById('game-over-overlay').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            
            document.getElementById('my-words').value = '';
            localStorage.removeItem(`bingo_words_${roomId}`);
            document.getElementById('word-count-status').innerText = '작성한 단어: 0 / 25개 (미완료)';
            document.getElementById('word-count-status').style.color = 'var(--danger)';

            if (roomId && isHost && supabaseClient) {
                const { data } = await supabaseClient.from('rooms').select('players_status').eq('id', roomId).maybeSingle();
                if (data && data.players_status) {
                    let ps = data.players_status;
                    Object.keys(ps).forEach(k => ps[k] = false);

                    await supabaseClient.from('rooms').update({ 
                        status: 'waiting', 
                        winner: null,
                        players_status: ps,
                        player_words: {},
                        current_clue: '시작 대기 중',
                        used_clues: []
                    }).eq('id', roomId);
                }
            }

            document.getElementById('waiting-room-screen').style.display = 'block';
            if (isHost) {
                document.getElementById('host-start-btn').style.display = 'block';
            }
        };

        function resetToWaitingRoomUI() {
            document.getElementById('game-over-overlay').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';

            document.getElementById('my-words').value = '';
            localStorage.removeItem(`bingo_words_${roomId}`);
            document.getElementById('word-count-status').innerText = '작성한 단어: 0 / 25개 (미완료)';
            document.getElementById('word-count-status').style.color = 'var(--danger)';

            document.getElementById('waiting-room-screen').style.display = 'block';
            document.getElementById('guest-waiting-msg').style.display = 'block';
        }
    </script>
</body>
</html>
